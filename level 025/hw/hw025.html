<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <title>დავალებები</title>
</head>

<body style="font-family: sans-serif; margin: 20px;">

    <header style="margin-bottom: 25px;">
        <h1 style="color: red; font-size: 32px; border: 2px dashed black; padding: 10px;">
            ჩემი საიტის სახელი
        </h1>
    </header>

    <section style="background-color: #3498db; color: white; padding: 20px; border-radius: 8px;">
        <article>
            <h2>თავი 1</h2>
            <p style="font-size: xx-large;">
                ეს არის სტატიის აბზაცი, რომელსაც აქვს დიდი ზომის ტექსტი.
            </p>
        </article>
    </section>

    <main style="margin-top: 25px;">
        <h2>მთავარი შინაარსი</h2>
        <p>ეს არის საიტის ძირითადი ნაწილი და მთავარი ტექსტი.</p>
    <aside
        style="color: green; background-color: yellow; border: 4px solid green; padding: 15px; margin-top: 20px; margin-bottom: 25px;">
        <h3>დამატებითი ინფორმაცია</h3>
        <p>ეს არის მეორეხარისხოვანი ინფორმაცია.</p>
    </aside>

    
    </main>

    
    <footer style="background-color: black; color: white; padding: 15px; text-align: center;">
        <p>© ყველა უფლება დაცულია</p>
    </footer>

</body>

</html>

<!-- 2) შექმენი საიტის ზედა ნაწილი <header> თეგით. შიგნით ჩასვი სათაური <h1> საიტის სახელით. style ატრიბუტით მიეცი სათაურს წითელი ფერი, ტექსტის ზომა და შემოავლე წყვეტილი ჩარჩო (border: 2px solid black;). -->
<!-- 3) შექმენი სექცია <section>, რომლის შიგნითაც მოათავსებ სტატიას <article>. სტატიაში ჩასვი სათაური "თავი 1" და ერთი აბზაცი <p> ტექსტით. style ატრიბუტით შეუცვალე მთლიან სექციას ფონის ფერი (background-color), ხოლო აბზაცის ტექსტის ფონტი გახადე დიდი (font-size: xx-large). -->
<!-- 4) შექმენი ძირითადი ნაწილი <main> რაიმე ტექსტით და მის ქვემოთ დაამატე მეორეხარისხოვანი ინფორმაციის თეგი <aside>. style ატრიბუტის გამოყენებით <aside> თეგს მიეცი მწვანე ტექსტის ფერი, ყვითელი ფონის ფერი და სქელი ჩარჩო (border: 4px solid green;). -->
<!-- 5) შექმენი საიტის ქვედა ნაწილი <footer> თეგით და შიგნით ჩაწერე საავტორო უფლებების ტექსტი (მაგალითად: "ყველა უფლება
    დაცულია"). style ატრიბუტით მთლიან ფუტერს მიეცი შავი ფონის ფერი (background-color: black;), ტექსტი გახადე თეთრი
    (color: white;). -->
