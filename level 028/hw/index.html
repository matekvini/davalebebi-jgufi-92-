<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <title>ტექსტის ფერები</title>
</head>

<body>

    <h1 style="color: crimson;">სათაური 1</h1>
    <p style="color: darkred;"> პარაგრაფი 1</p>

    <h1 style="color: rgb(30, 144, 255);"> სათაური 2</h1>
    <p style="color: rgb(25, 25, 112);"> პარაგრაფი 2</p>

    <h1 style="color: seagreen;"> სათაური 3</h1>

<!-- Inline CSS — იწერება თეგში style="" ატრიბუტით. ცვლის მხოლოდ 1 კონკრეტულ ელემენტს.

Internal CSS — იწერება HTML-ის <head>-ში, <style> თეგებში. ცვლის 1 კონკრეტულ HTML გვერდს.

External CSS — იწერება ცალკე .css ფაილში. ცვლის მთელ ვებსაიტს ერთდროულად. -->
