<!-- 1) შექმენით 5 ცალი p ელემენტი, წამოიღეთ ეგ ელემენტები tag selector-ის დახმარებით და ამ ყველა პარაგრაფს მიეცით წითელი ფერის ტექსტი, ყავისფერი უკანა ფორის ფერი და ტექსტის გაცენტვრა -->
<!DOCTYPE html>
<html>

<head>
    <style>
        p {
            color: red;
            background-color: rgb(151, 41, 41);
            text-align: center;
        }
    </style>
</head>

<body>

    <p>პირველი პარაგრაფი</p>
    <p>მეორე პარაგრაფი</p>
    <p>მესამე პარაგრაფი</p>
    <p>მეოთხე პარაგრაფი</p>
    <p>მეხუთე პარაგრაფი</p>

</body>

</html>





<!-- 2) შექმენით 4 ცალი h2 ელემენტი, ამ h2-ებს მიეცით ერთი და იგივე დასახელების class. თქვენი დავალებაა css-ში გასტილოთ ეს h2-ები კლასის დახმარებით. -->

<!DOCTYPE html>
<html>

<head>
    <style>
        .title-style {
            color: blue;
            background-color: lightgray;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2 class="title-style">პირველი სათაური</h2>
    <h2 class="title-style">მეორე სათაური</h2>
    <h2 class="title-style">მესამე სათაური</h2>
    <h2 class="title-style">მეოთხე სათაური</h2>

</body>

</html>

<!-- 3) შექმენით 1 ცალი h1 ელემენტი, ამ h2-ს მიეცით id და წამოიღეთ ეგ ელემენტი css-ში. თქვენი დავალებაა გასტილოთ ეგ h1 შესაბამისად id selector-ის დახმარებით -->

<!DOCTYPE html>
<html>

<head>
    <style>
        title {
            color: green;
            background-color: yellow;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1 id="first">სათაური</h1>

</body>

</html>
