    <!-- 1) შექმენით საიტი, სადაც გექნებათ 3 პარაგრაფი. თითოეულ პარაგრაფს გაუწერეთ თავისი id-ი. (მაგ: p-1, p-2, p-3) -->
    <!DOCTYPE html>
    <html>

    <head>
        <title>ჩემი პირველი საიტი</title>
    </head>

    <body>

        <p id="p-1">ეს არის პირველი პარაგრაფი.</p>
        <p id="p-2">ეს არის მეორე პარაგრაფი.</p>
        <p id="p-3">ეს არის მესამე პარაგრაფი.</p>

    </body>

    </html>

    <!-- პირველ პარაგრაფზე დაამატეთ ტექსტის დეკორაცია, მეორეზე გამოტანილ ტექსტს შეუცვალეთ case-ები (მაგალითად იყოს uppercase-ში), ხოლო მესამეზე დაამატეთ ტექსტის ჩრდილი ყველა მნიშვნელობებით.(horisontal offset, vertical offset, blur radius, color) -->

    <html>

    <body>

        <p id="p-1" style="text-decoration: underline;">pirveli paragrafi</p>

        <p id="p-2" style="text-transform: uppercase;">meore paragrafi</p>

        <p id="p-3" style="text-shadow: 2px 2px 5px red;">mesame paragrafi</p>

    </body>

    </html>

    <!-- ბოლოს დაამატეთ კიდევ ერთი სათაური და დაუმატეთ სამივე css-ის კუთვნილება რაც დღეს განვიხილეთ (text-decoration,
    text-transform, text-shadow) -->


    <html>

    <head>
        <style>
            #p-1 {
                text-decoration: underline;
            }

            #p-2 {
                text-transform: uppercase;
            }

            #p-3 {
                text-shadow: 2px 2px 5px red;
            }

            h1 {
                text-decoration: underline;
                text-transform: uppercase;
                text-shadow: 2px 2px 4px blue;
            }
        </style>
    </head>

    <body>

        <p id="p-1">pirveli paragrafi</p>
        <p id="p-2">meore paragrafi</p>
        <p id="p-3">mesame paragrafi</p>

        <h1>satauri</h1>
